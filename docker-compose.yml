services:

  # ── PHP-FPM Application ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: koi_app
    restart: unless-stopped
    environment:
      APP_NAME: "Koi Majesty"
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "http://localhost"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: koi
      DB_USERNAME: root
      DB_PASSWORD: koi123456
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      FILESYSTEM_DISK: public
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
      - app_public:/var/www/html/public
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - koi_network

  # ── Nginx Web Server ─────────────────────────────────────────────────────
  webserver:
    image: nginx:1.25-alpine
    container_name: koi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - app_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - ./public/images:/var/www/html/public/images:ro
      - ./public/videos:/var/www/html/public/videos:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - koi_network

  # ── MySQL 8.0 Database ───────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: koi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: koi123456
      MYSQL_DATABASE: koi
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pkoi123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - koi_network

  # ── phpMyAdmin (optional, remove in production) ──────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: koi_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: koi123456
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - koi_network

volumes:
  mysql_data:
  app_storage:
  app_bootstrap_cache:
  app_public:

networks:
  koi_network:
    driver: bridge
